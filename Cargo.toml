[package]
name = "aethonan"
version = "2.8.5"
description = "A Rust HTTP server for Python applications (a fork of Granian with native routes and websockets over HTTP/2)"
authors = ["Giovanni Barillari <g@baro.dev>"]
license = "BSD-3-Clause"
edition = "2024"

keywords = ["web", "asyncio", "aethonan"]

readme = "README.md"
homepage = "https://github.com/fiduswriter/aethonan"
repository = "https://github.com/fiduswriter/aethonan"

include = [
    "/Cargo.toml",
    "/pyproject.toml",
    "/build.rs",
    "/LICENSE",
    "/README.md",
    "/src",
    "/aethonan",
    "/tests",
    "!__pycache__",
    "!tests/.pytest_cache",
    "!*.so",
]

[lib]
name = "_aethonan"
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap = "1"
anyhow = "=1.0"
bytes = "1.11"
ciborium = "=0.2"
crossbeam-channel = "0.5"
encoding_rs = "=0.8"
futures = "=0.3"
futures-util = { version = "=0.3", default-features = false }
http-body-util = { version = "=0.1" }
hyper = { version = "=1.12", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1", features = ["server-auto", "tokio"] }
interprocess = { version = "=2.3.1", features = ["tokio"] }
itertools = "0.15"
log = { version = "0.4", features = ["std"] }
mimalloc = { version = "0.1.49", default-features = false, features = ["local_dynamic_tls"], optional = true }
mime_guess = "=2.0"
pem = "=3.0"
percent-encoding = "=2.3"
pin-project-lite = "=0.2"
pkcs8 = { version = "=0.11", features = ["encryption", "pkcs5"] }
pyo3 = { version = "=0.30", features = ["anyhow", "bytes", "extension-module", "generate-import-lib"] }
rustls-pemfile = "2.2"
serde = { version = "1.0.228", features = ["derive"] }
socket2 = { version = "=0.6", features = ["all"] }
sysinfo = "=0.39"
tikv-jemallocator = { version = "=0.7", default-features = false, features = ["disable_initial_exec_tls"], optional = true }
tls_listener = { package = "aethonan-tls-listener", version = "=0.11.2", features = ["rustls-ring", "rustls-tls12"] }
tokio = { version = "1.51", features = ["full"] }
tokio-stream = "0.1"
tokio-tungstenite = "=0.30"
tokio-util = { version = "0.7", features = ["codec", "rt"] }

[build-dependencies]
pyo3-build-config = "=0.30"

[features]
default = ["python-module"]
# Provides the `aethonan._aethonan` Python module.
# It must be disabled by crates embedding Aethonan as a library and providing
# their own module, to avoid the `PyInit__aethonan` symbol being defined twice.
python-module = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[profile.release]
lto = "fat"
panic = "abort"
strip = true

[profile.unstripped]
inherits = "release"
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
strip = false
